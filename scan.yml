name: Huurscanner

on:
  schedule:
    - cron: "*/5 * * * *"   # elke 5 minuten (GitHub kan bij drukte een paar minuten uitlopen)
  workflow_dispatch:
    inputs:
      test_telegram:
        description: "Alleen een testbericht naar Telegram sturen"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: huurscanner
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Scannen
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ "${{ inputs.test_telegram }}" = "true" ]; then
            python scanner.py --test-telegram
          else
            python scanner.py
          fi

      - name: Geheugen opslaan
        run: |
          git config user.name "huurscanner-bot"
          git config user.email "huurscanner-bot@users.noreply.github.com"
          git add state/seen.json
          if git diff --cached --quiet; then echo "Geen wijzigingen"; exit 0; fi
          git commit -m "scan $(date -u +%H:%M)" -q
          git pull --rebase -q
          git push -q
